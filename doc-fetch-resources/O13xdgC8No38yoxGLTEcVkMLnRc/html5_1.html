<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="viewport">
<meta name="description" content="VoxSign 手机交互模拟器：语音输入→ASR识别→意图/域/风险→刹车点确认→执行→四行回执→撤销→归因，可点击逐步模拟">
<title>VoxSign 手机交互模拟器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; background:#F2F4F7; color:#1F2329; }
  .wrap { display:flex; gap:14px; padding:14px; max-width:1000px; margin:0 auto; align-items:flex-start; }
  /* 手机框 */
  .phone { width:340px; min-width:340px; background:#fff; border-radius:34px; border:8px solid #1F2937; box-shadow:0 10px 30px rgba(0,0,0,.15); overflow:hidden; }
  .statusbar { background:#1F2937; color:#fff; font-size:10px; padding:6px 16px; display:flex; justify-content:space-between; }
  .apphead { background:#1E3A5F; color:#fff; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; }
  .apphead h1 { font-size:13px; font-weight:600; }
  .scenes { display:flex; gap:6px; }
  .scbtn { font-size:10px; padding:3px 8px; border-radius:10px; border:1px solid rgba(255,255,255,.4); background:transparent; color:#fff; cursor:pointer; }
  .scbtn.on { background:#2B6CB0; border-color:#2B6CB0; }
  .conv { height:430px; overflow-y:auto; padding:12px; background:#F7FAFD; display:flex; flex-direction:column; gap:10px; }
  .bubble { max-width:86%; padding:9px 12px; border-radius:14px; font-size:12.5px; line-height:1.5; animation:fade .35s; }
  .bubble.me { background:#EAF2FC; border:1px solid #BBD6F0; align-self:flex-end; border-top-right-radius:4px; }
  .bubble.sys { background:#fff; border:1px solid #DEE3E8; align-self:flex-start; border-top-left-radius:4px; }
  .bubble .who { font-size:10px; color:#646A73; margin-bottom:3px; font-weight:600; }
  .tagrow { display:flex; gap:5px; margin-top:5px; flex-wrap:wrap; }
  .tag { font-size:9.5px; padding:2px 7px; border-radius:9px; font-weight:600; }
  .tag.b { background:#EAF2FC; color:#1B4E8F; } .tag.o { background:#FDF1E7; color:#8A4B12; } .tag.g { background:#F6FBF8; color:#14532D; } .tag.r { background:#FDECEC; color:#9C2B2B; }
  .wave { display:inline-flex; gap:2px; align-items:center; height:12px; }
  .wave i { width:3px; background:#2B6CB0; border-radius:2px; animation:wb 0.9s infinite; }
  .wave i:nth-child(1){height:6px} .wave i:nth-child(2){height:11px;animation-delay:.15s} .wave i:nth-child(3){height:8px;animation-delay:.3s} .wave i:nth-child(4){height:12px;animation-delay:.45s} .wave i:nth-child(5){height:7px;animation-delay:.6s}
  @keyframes wb { 0%,100%{transform:scaleY(.6)} 50%{transform:scaleY(1.2)} }
  @keyframes fade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  /* 刹车点卡片 */
  .brake { border:1.5px solid #F2CDA8; background:#FFFBF7; border-radius:12px; padding:10px 12px; align-self:center; width:92%; }
  .brake h3 { font-size:11.5px; color:#8A4B12; margin-bottom:6px; }
  .brake .btns { display:flex; gap:8px; }
  .bk { flex:1; text-align:center; font-size:12px; font-weight:600; padding:7px 0; border-radius:9px; cursor:pointer; border:1px solid #DEE3E8; background:#fff; color:#1F2329; }
  .bk.yes { background:#2B6CB0; color:#fff; border-color:#2B6CB0; }
  .bk.no { background:#fff; color:#9C2B2B; border-color:#E4A6A6; }
  .bk.ed { background:#fff; color:#646A73; }
  /* 输入条 */
  .inputbar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid #E4E9EF; background:#fff; }
  .mic { width:36px; height:36px; border-radius:50%; background:#2B6CB0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .mic.on { background:#D97706; }
  .mic svg { width:16px; height:16px; fill:#fff; }
  .field { flex:1; background:#F2F4F7; border-radius:18px; padding:8px 12px; font-size:12px; color:#646A73; }
  /* Harness 流水线面板 */
  .pipe { flex:1; min-width:280px; background:#fff; border-radius:16px; padding:14px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .pipe h2 { font-size:13px; margin-bottom:10px; color:#1E3A5F; }
  .stages { display:flex; flex-wrap:wrap; gap:6px; }
  .stage { font-size:10.5px; padding:5px 9px; border-radius:8px; background:#F2F4F7; border:1px solid #E4E9EF; color:#646A73; font-weight:600; }
  .stage.act { background:#EAF2FC; border-color:#2B6CB0; color:#1B4E8F; animation:pulse 1s infinite; }
  .stage.done { background:#F6FBF8; border-color:#B7DCC8; color:#14532D; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  .detail { margin-top:12px; font-size:11.5px; color:#3B434F; line-height:1.7; background:#F8FAFC; border:1px solid #E4E9EF; border-radius:10px; padding:10px; min-height:120px; }
  .detail b { color:#1B4E8F; }
  .ctl { display:flex; gap:8px; margin-top:12px; }
  .btn { flex:1; padding:8px 0; border-radius:10px; font-size:12px; font-weight:600; border:1px solid #DEE3E8; background:#fff; color:#1F2329; cursor:pointer; }
  .btn.pri { background:#2B6CB0; color:#fff; border-color:#2B6CB0; }
  .btn.warn { background:#FDECEC; color:#9C2B2B; border-color:#E4A6A6; }
  .legend { font-size:10px; color:#646A73; margin-top:10px; line-height:1.7; }
  @media (max-width:760px) {
    .wrap { flex-direction:column; padding:10px; }
    .phone { width:100%; min-width:0; }
    .pipe { width:100%; }
    .conv { height:380px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 手机框 -->
  <div class="phone">
    <div class="statusbar">9:41 &nbsp; VoxSign</div>
    <div class="apphead">
      <h1>VoiceSign · 语音控制</h1>
      <div class="scenes">
        <button class="scbtn on" data-s="A" onclick="pickScene('A')">场景A 低风险</button>
        <button class="scbtn" data-s="B" onclick="pickScene('B')">场景B 高风险</button>
      </div>
    </div>
    <div class="conv" id="conv"></div>
    <div class="inputbar">
      <div class="mic" id="mic" onclick="toggleMic()"><svg viewBox="0 0 24 24"><path d="M12 14c1.7 0 3-1.3 3-3V5c0-1.7-1.3-3-3-3S9 3.3 9 5v6c0 1.7 1.3 3 3 3zm5-3c0 2.5-2.2 4.5-5 4.5S7 13.5 7 11H5c0 3.2 2.3 5.8 5.5 6.3V20h3v-2.7c3.2-.5 5.5-3.1 5.5-6.3h-2z"/></svg></div>
      <div class="field" id="field">按住说话，或点键盘输入</div>
    </div>
  </div>
  <!-- Harness 流水线面板 -->
  <div class="pipe">
    <h2>Harness 处理流水线（模拟实时状态）</h2>
    <div class="stages" id="stages"></div>
    <div class="detail" id="detail">点「下一步」开始模拟。绿色=已完成，蓝色闪烁=正在处理。<br><br><b>模拟内容：</b>你在手机说的话 → ASR 转写/纠错 → 意图识别 → 域选择 → 风险分级 → （高风险时）刹车点确认 → 执行 → verify → 四行回执 → 撤销 → 归因标注。右侧手机屏同步显示交互过程。</div>
    <div class="ctl">
      <button class="btn pri" id="next" onclick="next()">▶ 下一步</button>
      <button class="btn warn" onclick="doStop()">⏹ 停</button>
      <button class="btn" onclick="reset()">⟲ 重置</button>
    </div>
    <div class="legend">场景A=低风险静默执行（"记一下冀总那个厂房下周一出报价"）；场景B=高风险刹车点（"把刚才的改动提交到 git"）。模拟演示交互流程，用于 iOS 壳开发对齐。</div>
  </div>
</div>
<script>
const STAGES = ["ASR识别","意图解析","指代消解","域检查","风险分级","人工确认","执行","verify","回执","归因"];
const SCENES = {
  A: [
    {s:"me", t:"说", who:"你（语音）", wave:true, txt:"记一下冀总那个厂房下周一出报价"},
    {s:"sys", who:"ASR 转写 + 纠错", txt:"记一下冀总那个厂房下周一出报价", tags:[["b","ASR：冀总 ✓（季总→冀总纠错）"],["b","时间锚点：下周一"],["b","实体：冀总→厂房项目"]], stages:["ASR识别","意图解析"]},
    {s:"sys", who:"意图 / 域 / 风险", txt:"意图=NOTE（记录） · 域=vault-notes（想法库） · 风险=auto（可逆·小影响·高置信）→ 静默执行，不打断", tags:[["b","NOTE"],["b","域：vault-notes"],["g","风险：auto → 低风险直行"]], stages:["意图解析","指代消解","域检查","风险分级"]},
    {s:"sys", who:"执行中", txt:"记录到想法库… 解析时间锚点（下周一）… 轨迹写盘", tags:[["b","执行：只追加不改写"]], stages:["执行"], exec:true},
    {s:"sys", who:"回执（四行）", txt:"动作：NOTE（记录）<br>文件：vault-notes/idea-log.md（+1 条）<br>结果：OK（自动执行）<br>撤销：可撤销（备份目录）", tags:[["g","✓ verify 通过"]], stages:["verify","回执"]},
    {s:"sys", who:"归因标注（顺手点）", txt:"这次归谁？① 模型（意图分类正确） ② 执行 ③ 定义 —— 点选即回写认知闭环", tags:[["b","归因 → 认知回写"]], stages:["归因"]}
  ],
  B: [
    {s:"me", t:"说", who:"你（语音）", wave:true, txt:"把刚才的改动提交到 git"},
    {s:"sys", who:"ASR 转写", txt:"把刚才的改动提交到 git", tags:[["b","ASR ✓"]], stages:["ASR识别","意图解析"]},
    {s:"sys", who:"意图 / 域 / 风险", txt:"意图=COMMIT（提交） · 域=project:voicesign-harness · 风险=<b>不可逆</b> → 进入刹车点", tags:[["o","COMMIT"],["b","域：project"],["r","风险：不可逆 → 必须人工确认"]], stages:["意图解析","指代消解","域检查","风险分级"]},
    {s:"brake", who:"刹车点 · 强确认红条", txt:"提交 git commit（不可逆）<br>后果：本地提交已创建，改动固化为版本", tags:[["r","不可逆操作 · 防误触"]], stages:["人工确认"]},
    {s:"me", t:"确认", who:"你（点选）", txt:"执行（是）", wave:false},
    {s:"sys", who:"执行中", txt:"git add → git commit → 校验工作区状态", tags:[["b","执行：契约白名单内"]], stages:["执行"], exec:true},
    {s:"sys", who:"verify", txt:"读实际 git 状态 diff 预期：提交存在 ✓，工作区干净 ✓", tags:[["g","✓ verify：不读自报"]], stages:["verify"]},
    {s:"sys", who:"回执（四行）", txt:"动作：COMMIT（提交）<br>文件：voicesign-harness（+1 commit）<br>结果：OK（已人工确认）<br>撤销：不可撤销（不可逆，已人工确认）", tags:[["g","✓ 全链完成"]], stages:["回执"]},
    {s:"sys", who:"归因标注", txt:"这次归谁？① 模型 ② 执行 ③ 定义 —— 顺手点选，喂认知闭环", tags:[["b","归因 → 认知回写"]], stages:["归因"]}
  ]
};
let sc = "A", step = 0, running = false, done = false;
function renderStages(active){
  const names = STAGES.slice(0, active.length);
  const el = document.getElementById("stages");
  el.innerHTML = STAGES.map((n,i)=>{
    const cls = i < active.length ? (i === active.length-1 ? "act" : "done") : "";
    return `<span class="stage ${cls}">${i+1}.${n}</span>`;
  }).join("");
}
function render(rec){
  const conv = document.getElementById("conv");
  conv.innerHTML = "";
  rec.forEach((b,i)=>{
    if(b.s==="me"){
      const w = b.wave ? `<span class="wave"><i></i><i></i><i></i><i></i><i></i></span> ` : "";
      conv.innerHTML += `<div class="bubble me"><div class="who">${b.who||"你"}${b.t?" · "+b.t:""}</div>${w}${b.txt}</div>`;
    } else if(b.s==="brake"){
      conv.innerHTML += `<div class="brake"><h3>⚠ 刹车点 · 强确认（不可逆）</h3><p style="font-size:11px;color:#3B434F;margin-bottom:8px">${b.txt}</p><div class="btns"><button class="bk yes" onclick="confirmYes()">执行（是）</button><button class="bk no" onclick="confirmNo()">不执行（否）</button><button class="bk ed" onclick="confirmEdit()">改成…</button></div></div>`;
    } else {
      const tg = (b.tags||[]).map(t=>`<span class="tag ${t[0]}">${t[1]}</span>`).join("");
      conv.innerHTML += `<div class="bubble sys"><div class="who">${b.who||"Harness"}</div>${b.txt}${tg?`<div class="tagrow">${tg}</div>`:""}</div>`;
    }
  });
  conv.scrollTop = conv.scrollHeight;
  renderStages(b.stages||[]);
  document.getElementById("detail").innerHTML = `<b>${b.who||""}</b><br>${b.txt}` + ((b.tags||[]).map(t=>`<br><span style="color:#646A73">${t[1]}</span>`).join(""));
}
function showSoFar(){
  const rec = SCENES[sc].slice(0, step);
  render(rec);
  document.getElementById("field").textContent = running ? "识别中…（实时回显）" : done ? "会话完成 ✓" : "按住说话，或点键盘输入";
}
function next(){
  if(done) return;
  if(step >= SCENES[sc].length){ done = true; showSoFar(); return; }
  step++;
  showSoFar();
  if(step===1){ document.getElementById("mic").classList.add("on"); setTimeout(()=>document.getElementById("mic").classList.remove("on"), 800); }
}
function pickScene(s){ sc = s; step = 0; done = false; showSoFar(); }
function confirmYes(){ step++; showSoFar(); }
function confirmNo(){ step = step; document.getElementById("detail").innerHTML = "<b>你选择：不执行</b><br>任务已取消，未做任何改动（撤销/回滚同样可用）。<br><br>验证：BOUNDARY_VIOLATION 不因确认放行——这里是用户主动拒绝，即放弃。"; }
function confirmEdit(){ document.getElementById("detail").innerHTML = "<b>你选择：改成…</b><br>（演示占位：未来=回问候选集，改目标/参数后重新评估风险再进刹车点）"; }
function toggleMic(){ const m=document.getElementById("mic"); m.classList.toggle("on"); document.getElementById("field").textContent = m.classList.contains("on") ? "录音中… 说完松手" : "按住说话，或点键盘输入"; }
function doStop(){ document.getElementById("detail").innerHTML = "<b>⏹ 打断协议（barge-in）</b><br>说\"停\"立即截断当前播报/执行，显示已生效部分。<br>停播 ≠ 停止执行 ≠ 撤销——三者分离。<br>Cancel 令牌贯穿模型/执行/回滚三层。"; document.getElementById("field").textContent = "已停 ⏹（可继续/撤销）"; }
function reset(){ step = 0; done = false; pickScene(sc); document.getElementById("field").textContent = "按住说话，或点键盘输入"; }
showSoFar();
</script>
</body>
</html>
